name: Build LumIA Web for Windows

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "lumia_launcher.py"
      - "requirements.txt"
      - "templates/**"
      - "static/**"
      - "README-Windows.txt"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Check Python syntax
        run: python -m compileall -q app.py lumia_launcher.py

      - name: Build standalone Windows executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name "LumIA-Web" --add-data "templates;templates" --add-data "static;static" --hidden-import tkinter --hidden-import tkinter.ttk --collect-all flask --collect-all werkzeug --collect-all jinja2 --collect-all click --collect-all itsdangerous --collect-all markupsafe lumia_launcher.py
          Copy-Item README-Windows.txt dist/LEIA-ME.txt

      - name: Smoke test executable and local web server
        shell: pwsh
        run: |
          $env:LUMIA_NO_BROWSER = "1"
          $stdout = Join-Path $env:RUNNER_TEMP "lumia-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "lumia-stderr.log"
          $process = Start-Process -FilePath "$env:GITHUB_WORKSPACE\dist\LumIA-Web.exe" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $address = $null
            for ($i = 0; $i -lt 30; $i++) {
              if ($process.HasExited) {
                $err = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
                throw "O executável encerrou antes de iniciar. $err"
              }
              if (Test-Path $stdout) {
                $output = Get-Content $stdout -Raw
                if ($output -match 'http://127\.0\.0\.1:\d+') {
                  $address = $matches[0]
                  break
                }
              }
              Start-Sleep -Seconds 1
            }
            if (-not $address) {
              $out = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "" }
              $err = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
              throw "O executável não informou o endereço local. OUT: $out ERR: $err"
            }
            $response = Invoke-WebRequest -Uri "$address/login" -UseBasicParsing -TimeoutSec 10
            if ($response.StatusCode -ne 200) {
              throw "A página de login não respondeu com HTTP 200."
            }
            Write-Host "Smoke test OK: $address/login respondeu HTTP $($response.StatusCode)."
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
            if (Test-Path "dist/lumia.db") {
              Remove-Item "dist/lumia.db" -Force
            }
          }

      - name: Package Windows download
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/LumIA-Web.exe","dist/LEIA-ME.txt" -DestinationPath "LumIA-Web-Windows-x64.zip" -Force

      - name: Publish workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumIA-Web-Windows-x64
          path: LumIA-Web-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "lumia-web-v1.0.${{ github.run_number }}"
          name: "LumIA Web para Windows v1.0.${{ github.run_number }}"
          body: |
            Pacote executável do LumIA Web para Windows 10/11 de 64 bits.

            - Não requer instalação de Python.
            - Inclui o seletor de navegador.
            - O banco lumia.db é criado ao lado do executável na primeira execução.
            - Extraia o ZIP e execute LumIA-Web.exe.
          files: LumIA-Web-Windows-x64.zip
          draft: false
          prerelease: false
          make_latest: true
